<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Tavus Solutions Engineer</title>
<script crossorigin src="https://unpkg.com/@daily-co/daily-js"></script>
<style>
  :root {
    --bg: #0a0d12;
    --panel: #14171b;
    --card: #1d2128;
    --line: #232831;
    --ink: #e6e8eb;
    --muted: #8a93a0;
    --accent: #7aa9ff;
    --good: #4ade80;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 440px; gap: 10px; padding: 10px;
    height: 100vh; }
  #call { background: #000; border-radius: 10px; overflow: hidden; min-width: 0; }
  #call iframe { width: 100% !important; height: 100% !important; border: 0 !important; }
  #panel { background: var(--panel); border-radius: 10px; padding: 18px;
    display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  #panel-head { display: flex; justify-content: space-between; align-items: baseline; }
  #panel h2 { margin: 0; font-size: 13px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); }
  #panel-status { font-size: 11px; color: var(--muted); font-family: ui-monospace, monospace; }
  #panel-status.alive::before { content: "● "; color: var(--good); }
  #panel-body { flex: 1; min-height: 0; display: flex; flex-direction: column;
    margin-top: 10px; gap: 12px; overflow: auto; }
  .placeholder { color: var(--muted); font-style: italic; padding-top: 8px; }
  h3 { margin: 0; font-size: 18px; font-weight: 500; }
  .card { background: var(--card); padding: 14px 16px; border-radius: 8px;
    border: 1px solid var(--line); }
  .card .title { font-weight: 600; margin-bottom: 4px; }
  .card .snippet { color: var(--muted); font-size: 13px; max-height: 140px; overflow: auto;
    white-space: pre-wrap; }
  .card a { color: var(--accent); text-decoration: none; word-break: break-all; }
  .card a:hover { text-decoration: underline; }
  iframe.embed { width: 100%; flex: 1; border: 0; border-radius: 8px;
    background: white; min-height: 420px; }
  /* "Start a conversation" landing */
  #start { display: flex; align-items: center; justify-content: center;
    height: 100%; padding: 48px; text-align: center; flex-direction: column; gap: 18px; }
  #start h1 { font-size: 28px; font-weight: 500; margin: 0; }
  #start p { color: var(--muted); max-width: 520px; margin: 0; }
  .start-buttons { display: flex; gap: 16px; margin-top: 8px; flex-wrap: wrap;
    justify-content: center; }
  .start-btn { background: var(--accent); color: #0a0d12; border: 0;
    padding: 14px 28px; border-radius: 8px; font-size: 16px; font-weight: 600;
    cursor: pointer; min-width: 220px; }
  .start-btn.alt { background: var(--card); color: var(--ink);
    border: 1px solid var(--line); }
  .start-btn:disabled { opacity: 0.5; cursor: progress; }
  #start-error { color: #ff8080; font-size: 13px; min-height: 16px; }
  /* Tutor checklist */
  .tutor-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .tutor-list li { display: grid; grid-template-columns: 28px 1fr; align-items: baseline;
    padding: 12px 14px; background: var(--card); border-radius: 8px;
    border: 1px solid var(--line); color: var(--muted); font-size: 15px; }
  .tutor-list li .n { font-family: ui-monospace, monospace; color: var(--muted); }
  .tutor-list li.done { color: var(--ink); opacity: 0.7; }
  .tutor-list li.done .n::before { content: "✓"; color: var(--good); }
  .tutor-list li.done .n { font-size: 0; }
  .tutor-list li.done .n::before { font-size: 16px; }
  .tutor-list li.now { color: var(--ink); border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent); }
  .tutor-list li.now .n { color: var(--accent); font-weight: 700; }
  .persona-success { color: var(--good); }
  .copy-btn { margin-top: 10px; background: var(--accent); color: #0a0d12; border: 0;
    padding: 8px 14px; border-radius: 6px; font: 500 13px ui-monospace, monospace;
    cursor: pointer; }
  .copy-btn:disabled { opacity: 0.6; cursor: default; }
  .prompt-snippet { background: var(--card); padding: 14px 16px; border-radius: 8px;
    border: 1px solid var(--line); white-space: pre-wrap; font-size: 14px;
    line-height: 1.5; max-height: 240px; overflow: auto; }
  .feature-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .feature-list li { background: var(--card); padding: 11px 14px; border-radius: 8px;
    border: 1px solid var(--line); font-size: 13px; }
  .feature-list li .fname { font-size: 14px; color: var(--accent); font-weight: 600; }
  .feature-list li .fdesc { color: var(--muted); margin-top: 3px; }
  .recap-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .recap-list li { display: grid; grid-template-columns: 22px 1fr; gap: 10px;
    background: var(--card); padding: 10px 14px; border-radius: 8px;
    border: 1px solid var(--line); font-size: 13px; color: var(--ink); }
  .recap-list .done-mark { color: var(--good); font-weight: 700; font-size: 16px; line-height: 1.3; }
  .recap-list .todo-mark { color: var(--muted); font-size: 16px; line-height: 1.3; }
  .recap-list a { color: var(--accent); text-decoration: none; }
  .recap-list a:hover { text-decoration: underline; }
  .recap-list .fdesc { color: var(--muted); font-size: 12px; margin-top: 2px; }
  /* Personalized feature question card */
  .question-card { background: var(--card); padding: 16px; border-radius: 10px;
    border: 1px solid var(--line); }
  .question-card .qtext { font-size: 15px; line-height: 1.45; margin-bottom: 12px;
    color: var(--ink); }
  .opt-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .opt-list .opt { background: var(--bg); padding: 10px 14px; border-radius: 8px;
    border: 1px solid var(--line); font-size: 13px; color: var(--ink);
    display: grid; grid-template-columns: 24px 1fr; gap: 8px; align-items: baseline; }
  .opt-list .opt .marker { font-family: ui-monospace, monospace; color: var(--muted); }
  .feature-label { font-size: 12px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
</style>
</head>
<body>
<div id="app">
  <div id="call"></div>
  <aside id="panel">
    <div id="panel-head">
      <h2>Live Context</h2>
      <span id="panel-status">connecting…</span>
    </div>
    <div id="panel-body">
      <div class="placeholder">Nothing here yet. As the assistant looks something up
        or offers to schedule, it'll appear in this panel.</div>
    </div>
  </aside>
</div>

<script>
  /* ---------- state ---------- */
  let frame = null;
  let currentConvId = "";
  let calendlyUrl = "";

  const callDiv = document.getElementById("call");
  const panelBody = document.getElementById("panel-body");
  const panelStatus = document.getElementById("panel-status");

  /* ---------- helpers ---------- */
  function setPanel(html) { panelBody.innerHTML = html; }
  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }
  function setStatus(text, alive) {
    panelStatus.textContent = text;
    panelStatus.classList.toggle("alive", !!alive);
  }
  function parseArgs(a) {
    if (!a) return {};
    if (typeof a === "object") return a;
    try { return JSON.parse(a); } catch { return {}; }
  }

  /* ---------- visual panels ---------- */
  function showDoc(title, url, snippet) {
    setPanel(`
      <h3>${escapeHtml(title || "From the Tavus docs")}</h3>
      <div class="card">
        ${url ? `<div class="title"><a href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a></div>` : ""}
        ${snippet ? `<div class="snippet">${escapeHtml(snippet)}</div>` : ""}
      </div>
      ${url ? `<iframe class="embed" src="${escapeHtml(url)}" onerror="this.style.display='none'"></iframe>` : ""}`);
  }
  const TUTOR_STEPS = [
    "Create your persona  ·  POST /v2/personas",
    "Pick your replica  ·  stock or personal",
    "Start a conversation  ·  POST /v2/conversations",
  ];
  function showTutorProgress(currentStep) {
    const items = TUTOR_STEPS.map((label, i) => {
      const n = i + 1;
      const cls = n < currentStep ? "done" : n === currentStep ? "now" : "";
      return `<li class="${cls}"><span class="n">${n}</span><span>${escapeHtml(label)}</span></li>`;
    }).join("");
    const header = currentStep === 0
      ? `<h3>Build your first Tavus agent</h3>
         <div class="card" style="border-color:var(--accent);">
           <div class="title">Step 0 — share your screen, then go to platform.tavus.io/dev/personas/create</div>
           <div class="snippet">Hit screen-share in the call controls, then open
             the New Persona form. Once I can see it, we'll go.</div>
         </div>`
      : `<h3>Build your first Tavus agent</h3>`;
    setPanel(`${header}<ol class="tutor-list">${items}</ol>`);
  }

  function handleSuggestPrompt(args) {
    const useCase = String(args.use_case || "your agent");
    const text = String(args.prompt_text || "");
    console.log("[viewer] suggest_system_prompt", useCase, text.length, "chars");
    // Keep the checklist visible underneath the prompt card.
    const items = TUTOR_STEPS.map((label, i) => {
      const n = i + 1, cls = n === 1 ? "now" : "";
      return `<li class="${cls}"><span class="n">${n}</span><span>${escapeHtml(label)}</span></li>`;
    }).join("");
    setPanel(`
      <h3>Starting prompt for ${escapeHtml(useCase)}</h3>
      <div class="prompt-snippet" id="prompt-text">${escapeHtml(text)}</div>
      <button class="copy-btn" id="copy-prompt">Copy prompt</button>
      <ol class="tutor-list" style="margin-top: 16px;">${items}</ol>
    `);
    const btn = document.getElementById("copy-prompt");
    if (btn) btn.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(text);
        btn.textContent = "✓ Copied — paste into System Prompt";
        btn.disabled = true;
      } catch (e) {
        btn.textContent = "Select & copy manually";
      }
    });
  }

  const FEATURES = [
    { name: "Knowledge Base",
      desc: "RAG over your own docs — the agent answers from your data, not guesses.",
      example: "HR persona pulls real answers from your benefits handbook." },
    { name: "Objectives",
      desc: "Drive the conversation through a goal-oriented flow with branching.",
      example: "Medical intake: greet → symptoms → allergies → escalate." },
    { name: "Guardrails",
      desc: "Strict rules the agent must never cross.",
      example: "Finance agent never gives investment advice." },
    { name: "Tool Calling",
      desc: "Invoke your APIs mid-call to look things up or take action.",
      example: "Look up an order, kick off a workflow, render a UI card." },
    { name: "Visual Awareness",
      desc: "Raven sees the user's face and shared screen continuously.",
      example: "Spots an error on the user's screen, offers the fix in real time." },
    { name: "Pronunciation Dictionary",
      desc: "Teach the TTS to say specific names and jargon correctly.",
      example: "'Tavus' or your CEO's name come out right every time." },
  ];
  const NEXT_STEPS = [
    { name: "Attach a Knowledge Base",
      desc: "Ground the agent in your own docs.",
      url: "https://docs.tavus.io/sections/conversational-video-interface/knowledge-base" },
    { name: "Define Objectives",
      desc: "Drive the conversation through a goal-oriented flow.",
      url: "https://docs.tavus.io/sections/conversational-video-interface/persona/objectives" },
    { name: "Set Guardrails",
      desc: "Strict rules the agent must never cross.",
      url: "https://docs.tavus.io/sections/conversational-video-interface/guardrails" },
    { name: "Wire Tool Calling",
      desc: "Let the agent invoke your APIs mid-call.",
      url: "https://docs.tavus.io/sections/conversational-video-interface/persona/llm-tool" },
    { name: "Add Visual Awareness queries",
      desc: "Tell Raven what to watch for on the user's screen and face.",
      url: "https://docs.tavus.io/sections/conversational-video-interface/persona/perception" },
    { name: "Set up Memories",
      desc: "Cross-session continuity so the persona remembers users.",
      url: "https://docs.tavus.io/sections/conversational-video-interface/memories" },
    { name: "Pronunciation Dictionary",
      desc: "Teach the TTS to say specific names and jargon correctly.",
      url: "https://docs.tavus.io/sections/conversational-video-interface/persona/pronunciation-dictionaries" },
  ];
  function handleSessionRecap(args) {
    console.log("[viewer] show_session_recap", args);
    const personaName = String(args && args.persona_name || "your persona");
    const covered = [
      "Created a persona via POST /v2/personas",
      "Picked a stock replica",
      "Saw Tavus's 6 differentiator features",
      "Watched a tool call build live UI",
      "Started a live conversation with your agent",
    ];
    const coveredHtml = covered.map(c =>
      `<li><span class="done-mark">✓</span><span>${escapeHtml(c)}</span></li>`).join("");
    const nextHtml = NEXT_STEPS.map(n =>
      `<li><span class="todo-mark">☐</span><span>
        <a href="${escapeHtml(n.url)}" target="_blank" rel="noopener">
          <strong>${escapeHtml(n.name)}</strong></a>
        <div class="fdesc">${escapeHtml(n.desc)}</div></span></li>`).join("");
    setPanel(`
      <h3 class="persona-success">✓ ${escapeHtml(personaName)} is live</h3>
      <div style="margin-bottom: 8px;">
        <strong style="font-size:12px;letter-spacing:0.12em;color:var(--muted);">YOU COVERED</strong>
      </div>
      <ul class="recap-list">${coveredHtml}</ul>
      <div style="margin: 16px 0 8px;">
        <strong style="font-size:12px;letter-spacing:0.12em;color:var(--muted);">EXPLORE NEXT</strong>
      </div>
      <ul class="recap-list">${nextHtml}</ul>
    `);
  }

  function handleAskFeatureQuestion(args) {
    const feature = String(args.feature || "");
    const question = String(args.question || "");
    const options = Array.isArray(args.options) ? args.options : [];
    console.log("[viewer] ask_feature_question", feature);
    const letters = ["A", "B", "C", "D", "E"];
    const opts = options.map((o, i) =>
      `<li class="opt"><span class="marker">${letters[i] || (i + 1)}</span><span>${escapeHtml(String(o))}</span></li>`
    ).join("");
    const items = TUTOR_STEPS.map((label, i) => {
      const n = i + 1;
      const cls = n === 1 ? "now" : "";
      return `<li class="${cls}"><span class="n">${n}</span><span>${escapeHtml(label)}</span></li>`;
    }).join("");
    setPanel(`
      <div class="feature-label">${escapeHtml(feature)}</div>
      <h3 style="margin-top:2px;">Design this part of your agent</h3>
      <div class="question-card">
        <div class="qtext">${escapeHtml(question)}</div>
        <ul class="opt-list">${opts}</ul>
      </div>
      <ol class="tutor-list" style="margin-top: 16px;">${items}</ol>
    `);
  }

  function handleShowFeatures() {
    console.log("[viewer] show_features_overview");
    const cards = FEATURES.map(f =>
      `<li><div class="fname">${escapeHtml(f.name)}</div>
            <div class="fdesc">${escapeHtml(f.desc)}</div>
            <div class="fdesc" style="opacity:0.7;font-style:italic;margin-top:2px;">
              e.g. ${escapeHtml(f.example)}</div></li>`).join("");
    // Mark step 1 done, step 2 next.
    const items = TUTOR_STEPS.map((label, i) => {
      const n = i + 1;
      const cls = n === 1 ? "done" : n === 2 ? "now" : "";
      return `<li class="${cls}"><span class="n">${n}</span><span>${escapeHtml(label)}</span></li>`;
    }).join("");
    setPanel(`
      <h3>What makes Tavus humans great</h3>
      <ul class="feature-list">${cards}</ul>
      <ol class="tutor-list" style="margin-top: 16px;">${items}</ol>
    `);
  }

  async function handleCreatePersona(convId, args) {
    console.log("[viewer] create_persona_for_me", args);
    try {
      const r = await fetch("/personas", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          persona_name: args.persona_name || "My First Tavus Agent",
          system_prompt: args.system_prompt || "You are a helpful assistant.",
          default_replica_id: args.default_replica_id || "",
        }),
      });
      const data = await r.json();
      if (!r.ok || !data.persona_id) {
        const msg = data.error || `HTTP ${r.status}`;
        inject(convId,
          `Persona creation failed (${msg}). Apologize warmly in ONE short sentence and ` +
          `offer to schedule a follow-up so we can help them get it set up.`);
        setPanel(`<h3>Could not create persona</h3>
          <div class="card"><div class="snippet">${escapeHtml(msg)}</div></div>`);
        return;
      }
      inject(convId,
        `The persona was created successfully (persona_id ${data.persona_id}). In ONE warm ` +
        `sentence, tell the user it's live, that they can open it in the dashboard, and ` +
        `offer to schedule a follow-up if they want help launching it.`);
      setPanel(`
        <h3 class="persona-success">✓ Your first Tavus agent is live</h3>
        <div class="card">
          <div class="title">${escapeHtml(data.persona_name || "")}</div>
          <div>persona_id: <code>${escapeHtml(data.persona_id)}</code></div>
          <div style="margin-top:8px;"><a href="${escapeHtml(data.dashboard_url)}"
            target="_blank" rel="noopener">Open in dashboard →</a></div>
        </div>`);
    } catch (e) {
      console.error("[viewer] create persona error", e);
      inject(convId, `Tell the user the persona creation hit an error and offer to follow up.`);
    }
  }

  function showCalendly(url) {
    const sep = url.includes("?") ? "&" : "?";
    const embedSrc = `${url}${sep}embed_domain=${location.hostname}&embed_type=Inline`;
    setPanel(`
      <h3>Grab time with me</h3>
      <iframe class="embed" src="${escapeHtml(embedSrc)}" onerror="this.style.display='none'"></iframe>
      <div class="card">
        <div class="title">If the inline view doesn't load, open directly:</div>
        <a href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(url)}</a>
      </div>`);
  }

  /* ---------- in-browser bridge (replaces bridge.py for this tab) ---------- */
  async function fetchDocs(query) {
    const r = await fetch("/ask", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ query, top_k: 3 }),
    });
    if (!r.ok) throw new Error(`/ask ${r.status}`);
    return r.json();
  }

  function inject(convId, context) {
    if (!frame || !context) return;
    frame.sendAppMessage({
      message_type: "conversation",
      event_type: "conversation.append_llm_context",
      conversation_id: convId || currentConvId,
      properties: { context },
    }, "*");
    console.log("[viewer] injected", context.length, "chars");
  }

  async function handleSearchDocs(convId, query) {
    console.log("[viewer] search_tavus_docs", query);
    try {
      const data = await fetchDocs(query);
      inject(convId, data.context || "");
      const top = (data.sources || [])[0];
      if (top) showDoc(top.title, top.url, (data.context || "").slice(0, 600));
    } catch (e) {
      console.error("[viewer] docs error", e);
      inject(convId, `Documentation lookup failed for: ${query}`);
    }
  }

  async function handleCaptureScreenIssue(convId, summary) {
    console.log("[viewer] capture_screen_issue", summary);
    let docs = "", sources = [];
    try {
      const data = await fetchDocs(`troubleshoot: ${summary}`);
      docs = data.context || ""; sources = data.sources || [];
    } catch (e) { console.error("[viewer] docs error", e); }
    inject(convId,
      `The user appears to have this issue visible on their screen: ${summary}\n\n` +
      `Relevant Tavus documentation:\n${docs}`);
    if (sources[0]) showDoc(sources[0].title, sources[0].url, docs.slice(0, 600));
  }

  // Audio perception fired escalate: only ASK the user, don't surface calendar yet.
  function handleEscalate(convId, reason) {
    console.log("[viewer] escalate_to_human -> ask user", reason);
    inject(convId,
      `INTERNAL CUE — NOT a user question, do NOT look anything up. ` +
      `The user has sounded stuck for a moment (signal: ${reason}). ` +
      `Speak ONE short, warm sentence checking in and ask if they'd like to schedule ` +
      `a quick call with a human to work through it. Do NOT call search_tavus_docs or ` +
      `any other tool right now. Do NOT mention a calendar link. Then wait for their answer. ` +
      `If they affirm (yes / sure / please / send it), call the offer_calendar tool with ` +
      `the reason. If they decline or say "I'm fine," just continue normally.`);
    // Intentionally NOT showing Calendly here.
  }

  // LLM-side tool: only call after user agreed -> actually show Calendly.
  function handleOfferCalendar(convId, reason) {
    console.log("[viewer] offer_calendar", reason);
    if (!calendlyUrl) {
      console.log("[viewer] no CALENDLY_URL configured on server");
      inject(convId, "Tell the user there's no calendar configured yet and you'll follow up by email.");
      return;
    }
    inject(convId,
      `The user agreed to schedule. Say one short, warm sentence that you're pulling up ` +
      `the calendar now and they can grab any time that works. Then go quiet while they pick.`);
    showCalendly(calendlyUrl);
  }

  function onAppMessage(ev) {
    const msg = ev && ev.data;
    if (!msg || typeof msg !== "object") return;
    const et = msg.event_type;
    const props = msg.properties || {};
    const convId = msg.conversation_id || currentConvId;

    if (et === "conversation.tool_call") {
      const name = props.name || (props.function && props.function.name);
      const args = parseArgs(props.arguments ?? (props.function && props.function.arguments));
      if (name === "search_tavus_docs") {
        const q = args.query || args.q || "";
        if (q) handleSearchDocs(convId, q);
      } else if (name === "offer_calendar") {
        handleOfferCalendar(convId, args.reason || "");
      } else if (name === "tutor_step") {
        const n = parseInt(args.n, 10) || 0;
        if (n > 0) showTutorProgress(n);
      } else if (name === "suggest_system_prompt") {
        handleSuggestPrompt(args);
      } else if (name === "show_features_overview") {
        handleShowFeatures();
      } else if (name === "ask_feature_question") {
        handleAskFeatureQuestion(args);
      } else if (name === "show_session_recap") {
        handleSessionRecap(args);
      } else if (name === "create_persona_for_me") {
        handleCreatePersona(convId, args);
      }
      return;
    }

    if (et === "conversation.perception_tool_call") {
      const name = props.name || (props.function && props.function.name);
      const args = parseArgs(props.arguments ?? (props.function && props.function.arguments));
      if (name === "describe_screen" && args.focus) {
        inject(convId, `What the user is looking at on their screen: ${args.focus}`);
      } else if (name === "capture_screen_issue" && args.summary) {
        handleCaptureScreenIssue(convId, args.summary);
      } else if (name === "escalate_to_human") {
        handleEscalate(convId, args.reason || "the user seems stuck");
      }
      return;
    }
  }

  /* ---------- join + start flows ---------- */
  function joinRoom(url, convId) {
    currentConvId = convId || "";
    callDiv.innerHTML = "";
    frame = window.DailyIframe.createFrame(callDiv, {
      iframeStyle: { width: "100%", height: "100%", border: "0" },
      showLeaveButton: true,
    });
    frame.on("app-message", onAppMessage);
    frame.on("joined-meeting", () => setStatus("listening", true));
    frame.on("left-meeting", () => setStatus("disconnected", false));
    frame.join({ url });
    setStatus("joining…", false);
  }

  function showStart() {
    callDiv.innerHTML = `
      <div id="start">
        <h1>Talk to a Tavus Solutions Engineer</h1>
        <p>Live video call with a Tavus expert. Share your screen and they'll
           see what you're working on. Pick how you want to start:</p>
        <div class="start-buttons">
          <button class="start-btn" data-mode="se">Help me build something</button>
          <button class="start-btn alt" data-mode="tutor">I'm brand new (10-min tutor)</button>
        </div>
        <div id="start-error"></div>
      </div>`;
    const err = document.getElementById("start-error");
    document.querySelectorAll(".start-btn").forEach(btn => {
      btn.addEventListener("click", async () => {
        const mode = btn.getAttribute("data-mode") || "se";
        document.querySelectorAll(".start-btn").forEach(b => b.disabled = true);
        err.textContent = "";
        try {
          const r = await fetch("/conversations", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ mode }),
          });
          const data = await r.json();
          if (!r.ok || !data.conversation_url) {
            throw new Error(data.error || `HTTP ${r.status}`);
          }
          window.TAVUS_MODE = data.mode || mode;
          joinRoom(data.conversation_url, data.conversation_id);
          if (window.TAVUS_MODE === "tutor") showTutorProgress(0);
        } catch (e) {
          document.querySelectorAll(".start-btn").forEach(b => b.disabled = false);
          err.textContent = `Couldn't start a conversation: ${e.message}`;
        }
      });
    });
  }

  /* ---------- boot ---------- */
  (async function init() {
    try {
      const cfg = await fetch("/config").then(r => r.json());
      calendlyUrl = cfg.calendly_url || "";
    } catch { /* non-fatal */ }

    const params = new URLSearchParams(location.search);
    const conv = params.get("conversation");
    const convId = params.get("conversation_id") || "";
    if (conv) {
      joinRoom(conv, convId);
    } else {
      showStart();
      setStatus("idle", false);
    }
  })();
</script>
</body>
</html>
