# DECISION ZERO. The form has 10 vendor columns. Tavus lists 20 authorized
# sub-processors. This scope takes the EXPANDED path: all 20 stay in, and
# overflow_handling: second_sheet tells fill_workbook.py to write additional
# copies of the form for vendors 11+. Confirm with SAP that they will accept a
# second sheet before submitting (the alternative is asking them to name the
# subset they care about).
#
# Tavus's own subprocessor page says "depending on the Tavus product your
# organization utilizes... certain sub-processors may not be applicable." If
# SAP's deployment doesn't touch the corporate/business systems (Slack, Pylon,
# Salesforce, Stripe, Orb), cutting those five gets the list to 15.
#
# confirmed: set to true only after a human has signed off on this list.
# Signed off by tim@tavus.io on 2026-07-31 (Claude Code session): expand scope
# to all 20 authorized sub-processors, overflow via second sheet.
confirmed: true
overflow_handling: second_sheet   # "second_sheet" | "appended_tab" | "sap_confirmed_subset"

# Full list from https://www.tavus.io/authorized-subprocessors (eff. 2026-04-27).
# Levels are unverified guesses (level 1 = direct vendor) — confirm each.
# Note from the field playbook: Cerebrium/Replicate/Fal run on AWS/GCP, so the
# hyperscalers are arguably Level 1 AND Level 2. Flagged in notes, not guessed.
# soc2_on_file_in_vanta: null = not yet checked against Vanta. Check before 1.4.2.

subprocessors:
  # --- In the media data path (raw end-user video/audio) ---
  - name: "Google Cloud Platform"
    slug: gcp
    role: "Cloud infrastructure, data hosting"
    level: 1
    in_data_path: true
    data_touched: "raw video and audio, replica training data, account metadata"
    soc2_on_file_in_vanta: null
    notes: "Also Level 2 via GPU/inference vendors that run on GCP."
  - name: "Amazon Web Services"
    slug: aws
